# 작업 종류 → 별칭 대체 순서. 앞에서부터 시도하고,
# 한도 초과·로그인 만료 같은 공급자 문제가 생기면 다음 별칭으로 넘어갑니다.

# 분류 신호가 없거나 비길 때: execute(직접 실행) 또는 delegate(비코딩 에이전트에게 넘김)
defaultWhenUnsure: execute

# true면 가벼운 작업(lightTaskTypes)을 local 별칭(Ollama 등)에 먼저 맡깁니다.
preferLocal: false
lightTaskTypes: [test, docs]

# 인증·결제·삭제 등 위험도 높은 작업에 가장 먼저 쓸 별칭
highRiskAlias: smart

# 공급자 문제일 때 대체 순서에서 몇 번까지 넘어갈지
maxFallbacks: 1

taskTypes:
  design:    [smart, coder]
  implement: [coder, smart]
  refactor:  [coder, smart]
  test:      [fast, coder]
  docs:      [fast, coder]
  research:  [longctx, smart]
  ops:       [coder, smart]     # 터미널·파일 작업 (스크립트 실행, 엑셀 파싱, 디컴파일 등)
  review:    [reviewer, smart]

# 큰 이슈를 여러 하위 작업으로 나눠 여러 AI에게 동시에 맡기는 설정
planning:
  # auto: 할 일 목록이 3개 이상이거나 설명이 긴 이슈만 나눔 / always: 항상 / never: 나누지 않음
  mode: auto
  # 한 이슈를 최대 몇 개로 나눌지
  maxSubtasks: 5
  # 동시에 몇 개까지 실행할지 (구독 한도가 빨리 줄면 낮추세요)
  concurrency: 3
  # 작업을 나누는 AI (별칭)
  planner: smart

# 실행이 끝난 뒤 처리 (설정 화면에서도 바꿀 수 있어요)
results:
  # 하위 작업이 모두 성공하면 결과 브랜치를 작업 폴더의 현재 브랜치에 합침
  autoMerge: true
  # 성공하면 이슈를 완료로 바꿈 (실패하면 항상 막힘으로 바꿈)
  markDoneOnSuccess: true
  # 하위 작업 브랜치를 합치다 충돌하면 AI(highRiskAlias)에게 한 번 풀게 함
  resolveConflicts: true
  # 합친 결과로 프로젝트 테스트를 돌림. 실패하면 작업 폴더에 합치지 않음
  runTests: true
  # 테스트 명령. 비우면 package.json의 test 스크립트나 pytest 설정을 보고 자동으로 찾음
  testCommand: ""
  # 합친 전체 변경을 구현과 다른 회사 모델(review 순서)에게 검토받음
  review: true
