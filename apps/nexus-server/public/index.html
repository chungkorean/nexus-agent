<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus 설정</title>
<link rel="stylesheet" href="/base.css">
<style>

/* 1. 작업별 담당 AI */
table.tasks { width: 100%; border-collapse: collapse; }
table.tasks th { text-align: left; font-size: 15px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.tasks td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tasks tr:last-child td { border-bottom: 0; }
table.tasks td.task { font-weight: 700; width: 24%; }
table.tasks .extra { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.cell-label { display: none; font-size: 14px; color: var(--muted); }

/* 2. 작업 나누기 */
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.choice { position: relative; display: block; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice strong { display: block; font-size: 18px; }
.choice span { display: block; font-size: 15px; color: var(--muted); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field > span { display: block; font-weight: 600; margin-bottom: 4px; }

/* 4. 계정 */
.accounts { list-style: none; margin: 0 0 18px; padding: 0; }
.account { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.account-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.account-name { font-weight: 700; font-size: 18px; }
.account-meta { font-size: 15px; color: var(--muted); }
.badge { display: inline-block; font-size: 15px; font-weight: 700; padding: 3px 12px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.account-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; color: var(--muted); text-align: center; }
.add-box { border-top: 1px solid var(--line); padding-top: 16px; }
.add-box h3 { margin: 0 0 10px; font-size: 18px; }
.engine-choices { grid-template-columns: 1fr 1fr; }
.stack > * + * { margin-top: 12px; }

/* 5. AI 모델 */
.models { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.model { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.model-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.model-head .tag { font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.checks { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; min-height: 48px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.check .order { margin-left: auto; font-size: 14px; color: var(--accent); font-weight: 700; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-weight: 600; min-height: 36px; display: flex; align-items: center; }
details .inner { padding-top: 8px; }

/* 6. 기타 */
.toggle-row { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.subhead { font-size: 15px; margin: 22px 0 4px; }
.field.indent { display: block; margin: -4px 0 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
#sec-results .toggle-row:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.toggle-row strong { display: block; font-size: 18px; }

/* 왼쪽 메뉴 + 오른쪽 내용 */
main { max-width: 1180px; }
.settings { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
nav.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); }
nav.side a { display: block; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--text); }
nav.side a:hover { background: var(--bg); }
nav.side a[aria-current=page] { background: var(--accent-soft); }
nav.side a[aria-current=page] .side-title { color: var(--accent); }
nav.side a:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.side-title { display: block; font-weight: 700; font-size: 16px; }
.side-sub { display: block; font-size: 13px; color: var(--muted); }
.pane > section { margin-top: 0; }
.pane h2 .num { display: none; }
@media (max-width: 900px) {
  .settings { grid-template-columns: 1fr; gap: 12px; }
  nav.side { position: static; flex-direction: row; overflow-x: auto; padding: 6px; scrollbar-width: thin; }
  nav.side a { flex: none; padding: 8px 12px; }
  .side-sub { display: none; }
}

/* 모델 고르기 */
.picker { position: relative; }
.picker-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; font-weight: 600; padding: 8px 12px; }
.picker-btn .pk-main { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-btn .pk-sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-btn .pk-text { min-width: 0; }
.picker-btn::after { content: "▾"; color: var(--muted); flex: none; }
.popwrap { position: absolute; z-index: 25; top: calc(100% + 6px); left: 0; display: flex; align-items: flex-start; gap: 6px; }
.popwrap.right { left: auto; right: 0; flex-direction: row-reverse; }
.pop {
  width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  padding: 6px; max-height: min(70vh, 520px); overflow: auto;
}
.pop.sub { width: 340px; }
.pop[hidden] { display: none; }
.pop-item.prov.open { background: var(--accent-soft); }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 10px; min-height: 44px; padding: 8px 12px; font-weight: 500; text-align: left; }
.pop-item:hover:not(:disabled), .pop-item:focus-visible { background: var(--accent-soft); }
.pop-item .pi-text { flex: 1; min-width: 0; }
.pop-item .pi-sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; overflow-wrap: anywhere; }
.pop-item .pi-right { margin-left: auto; color: var(--muted); font-size: 14px; flex: none; }
.pop-item .pi-check { color: var(--accent); font-weight: 700; flex: none; width: 18px; }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-head { font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 12px 4px; }
.pop input[type=text] { min-height: 42px; margin: 4px 0 6px; }
.pop .pop-note { font-size: 13px; color: var(--muted); padding: 6px 12px; }
.pop .tag-free { font-size: 12px; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
@media (max-width: 640px) {
  .popwrap, .popwrap.right { position: fixed; left: 8px; right: 8px; top: auto; bottom: 8px; display: block; }
  .pop, .pop.sub { width: auto; max-height: 75vh; }
}
.model-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.prov-group + .prov-group { margin-top: 20px; }
.prov-head { font-size: 17px; margin: 0 0 10px; }
.models-top { display: flex; justify-content: flex-end; margin: -4px 0 12px; }

/* 7. 사용량 */
.period-choices { grid-template-columns: repeat(4, 1fr); }
.period-choices .choice { text-align: center; padding: 10px 8px; }
.period-choices .choice strong { font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 16px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stat span { display: block; font-size: 14px; color: var(--muted); }
.stat strong { font-size: 22px; font-variant-numeric: tabular-nums; }
table.usage td.num-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 4px; min-width: 80px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.full > i { background: var(--bad); }
.budget-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.budget-line { font-size: 15px; margin-top: 8px; }
input[type=number] {
  font: inherit; color: var(--text); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 10px;
  padding: 10px 12px; min-height: 48px; width: 100%;
}
.hint-list { margin: 0 0 16px; }

/* 8. 텔레그램 */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps > li { position: relative; padding: 0 0 18px 44px; border-left: 2px solid var(--line); margin-left: 15px; }
.steps > li:last-child { border-left-color: transparent; padding-bottom: 0; }
.steps > li::before {
  counter-increment: step; content: counter(step);
  position: absolute; left: -16px; top: 0; width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  background: var(--card); border: 2px solid var(--line); color: var(--muted);
}
.steps > li.done::before { content: "✓"; background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.steps h3 { margin: 2px 0 6px; font-size: 18px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.inline-form > input, .inline-form > select { flex: 1 1 240px; width: auto; }
.code-box { font-family: Consolas, "D2Coding", monospace; font-size: 34px; letter-spacing: 8px; font-weight: 700; padding: 8px 16px; border: 2px dashed var(--accent); border-radius: 12px; display: inline-block; margin: 6px 0; }
.chat-list { list-style: none; padding: 0; margin: 8px 0; }
.chat-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; margin-bottom: 6px; }

/* 아래 고정 막대 */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card); border-top: 1px solid var(--line);
  box-shadow: 0 -2px 12px rgba(0,0,0,.08);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.bar-inner { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar-status { flex: 1 1 200px; font-size: 16px; color: var(--muted); }
.bar-status.dirty { color: var(--accent); font-weight: 700; }
.bar-buttons { display: flex; gap: 8px; flex-wrap: wrap; }


@media (max-width: 640px) {
  body { font-size: 16px; }
  header h1 { font-size: 24px; }
  section.card { padding: 16px; }
  table.tasks thead { display: none; }
  table.tasks, table.tasks tbody, table.tasks tr, table.tasks td { display: block; width: 100%; }
  table.tasks tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
  table.tasks tr:last-child { border-bottom: 0; }
  table.tasks td { border: 0; padding: 4px 0; }
  table.tasks td.task { width: 100%; font-size: 18px; }
  .cell-label { display: block; }
  .choices, .engine-choices, .row2, .budget-fields { grid-template-columns: 1fr; }
  .period-choices, .stats { grid-template-columns: 1fr 1fr; }
  .bar-buttons { width: 100%; }
  .bar-buttons button { flex: 1 1 0; padding: 8px 6px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Nexus 설정</h1>
    <p>어떤 일을 어떤 AI에게 맡길지 정해요. 저장한 내용은 다음 작업부터 적용돼요.</p>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <div id="app"><p class="loading">설정을 불러오는 중이에요...</p></div>
  <footer id="footer"></footer>
</main>

<div class="bar" id="bar">
  <div class="bar-inner">
    <div class="bar-status" id="barStatus">바꾼 내용이 없어요.</div>
    <div class="bar-buttons">
      <button type="button" id="btnPreview">미리 보기</button>
      <button type="button" id="btnSave" class="primary">저장</button>
      <button type="button" id="btnRollback">되돌리기</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="assertive"></div>
<div class="modal-back" id="modalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div></div>

<script src="/common.js"></script>
<script>
"use strict";
const ENGINE_NAMES = { "claude-code": "Claude 구독", opencode: "그 밖의 AI (OpenCode)" };
const PROVIDERS = [
  ["openai", "ChatGPT / OpenAI"],
  ["google", "Gemini / Google"],
  ["github-copilot", "GitHub Copilot"],
  ["openrouter", "OpenRouter"],
  ["ollama", "Ollama (내 컴퓨터)"],
  ["opencode", "그 밖의 서비스"],
];
const PROVIDER_NAMES = Object.fromEntries([["anthropic", "Claude"], ...PROVIDERS]);
const MODES = [
  ["auto", "자동", "큰 작업만 나눠서 맡겨요"],
  ["always", "항상", "모든 작업을 나눠서 맡겨요"],
  ["never", "안 함", "나누지 않고 한 번에 맡겨요"],
];

let S = null;      // 서버에서 받은 상태
let orig = null;   // 저장된 값
let draft = null;  // 화면에서 고치는 값
let busy = false;
renderNav("settings");

// ---------- 작은 도우미 ----------
const clone = (x) => JSON.parse(JSON.stringify(x));
const aliasLabel = (name) => (S.aliases.find((a) => a.name === name) || {}).label || name;
const draftLabel = (name) => (draft && draft.aliases[name] && draft.aliases[name].label.trim()) || aliasLabel(name);
// ---------- 상태 → 편집 값 ----------
function toDraft(s) {
  const tasks = {};
  for (const t of s.taskTypes) tasks[t.id] = { first: t.chain[0] || "", second: t.chain[1] || "" };
  const aliases = {};
  for (const a of s.aliases) aliases[a.name] = { label: a.label, model: a.model, accounts: a.accounts.slice(), engine: a.engine };
  return {
    tasks,
    aliases,
    preferLocal: s.routing.preferLocal,
    maxFallbacks: s.routing.maxFallbacks,
    highRiskAlias: s.routing.highRiskAlias,
    planning: { mode: s.routing.planning.mode, concurrency: s.routing.planning.concurrency, maxSubtasks: s.routing.planning.maxSubtasks, planner: s.routing.planning.planner },
    results: { ...s.routing.results },
    budgets: budgetDraft(s.accounts),
  };
}

function budgetDraft(accounts) {
  const out = {};
  for (const a of accounts) out[a.id] = { usd: a.monthlyBudgetUsd ? String(a.monthlyBudgetUsd) : "", tokens: a.monthlyTokenLimit ? String(a.monthlyTokenLimit) : "" };
  return out;
}

// 예산 칸: 비우면 null(제한 없음), 숫자가 아니면 그대로 보내 서버가 알려 주게 한다.
function budgetValue(text) {
  const t = String(text).replace(/[,\s]/g, "");
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : t;
}

// 바꾼 항목만 담아 서버에 보낸다.
function buildChanges() {
  const c = {};
  for (const [id, t] of Object.entries(draft.tasks)) {
    const o = orig.tasks[id];
    if (t.first !== o.first || t.second !== o.second) (c.taskTypes = c.taskTypes || {})[id] = { first: t.first, second: t.second || null };
  }
  for (const [name, a] of Object.entries(draft.aliases)) {
    if (a.isNew) {
      if (!a.removed) (c.newAliases = c.newAliases || {})[name] = { engine: a.engine, model: a.model.trim(), label: a.label.trim() || a.model, accounts: a.accounts.slice() };
      continue;
    }
    if (a.removed) { (c.removeAliases = c.removeAliases || []).push(name); continue; }
    const o = orig.aliases[name];
    const d = {};
    if (a.label.trim() !== o.label) d.label = a.label.trim();
    if (a.model.trim() !== o.model) d.model = a.model.trim();
    if (a.accounts.join("\n") !== o.accounts.join("\n")) d.accounts = a.accounts.slice();
    if (Object.keys(d).length) (c.aliases = c.aliases || {})[name] = d;
  }
  if (draft.preferLocal !== orig.preferLocal) c.preferLocal = draft.preferLocal;
  if (draft.maxFallbacks !== orig.maxFallbacks) c.maxFallbacks = draft.maxFallbacks;
  if (draft.highRiskAlias !== orig.highRiskAlias) c.highRiskAlias = draft.highRiskAlias;
  for (const k of ["mode", "concurrency", "maxSubtasks", "planner"]) {
    if (draft.planning[k] !== orig.planning[k]) (c.planning = c.planning || {})[k] = draft.planning[k];
  }
  for (const [id, b] of Object.entries(draft.budgets)) {
    const o = orig.budgets[id];
    if (!o) continue;
    const d = {};
    if (budgetValue(b.usd) !== budgetValue(o.usd)) d.monthlyBudgetUsd = budgetValue(b.usd);
    if (budgetValue(b.tokens) !== budgetValue(o.tokens)) d.monthlyTokenLimit = budgetValue(b.tokens);
    if (Object.keys(d).length) (c.budgets = c.budgets || {})[id] = d;
  }
  for (const k of ["autoMerge", "markDoneOnSuccess", "resolveConflicts", "runTests", "review", "testCommand", "githubPush", "githubPullRequest", "githubRemote"]) {
    const v = typeof draft.results[k] === "string" ? draft.results[k].trim() : draft.results[k];
    if (v !== orig.results[k]) (c.results = c.results || {})[k] = v;
  }
  return c;
}

function countChanges(c) {
  let n = 0;
  n += Object.keys(c.taskTypes || {}).length;
  n += Object.keys(c.newAliases || {}).length + (c.removeAliases || []).length;
  for (const v of Object.values(c.aliases || {})) n += Object.keys(v).length;
  n += ["preferLocal", "maxFallbacks", "highRiskAlias"].filter((k) => k in c).length;
  n += Object.keys(c.planning || {}).length;
  n += Object.keys(c.results || {}).length;
  for (const v of Object.values(c.budgets || {})) n += Object.keys(v).length;
  return n;
}

function refreshBar() {
  const n = draft && orig ? countChanges(buildChanges()) : 0;
  const st = $("barStatus");
  st.textContent = n ? "저장하지 않은 바뀐 내용이 " + n + "개 있어요." : "바뀐 내용이 없어요.";
  st.classList.toggle("dirty", n > 0);
  $("btnSave").disabled = busy || n === 0;
  $("btnPreview").disabled = busy || n === 0;
  $("btnRollback").disabled = busy || !S || !S.canRollback;
}

// ---------- 화면 그리기 ----------
// ---------- 모델 고르기 ----------
let C = null;            // 연결해 둔 모델 목록 (/api/models)
let catalogLoading = null;
let openPop = null;      // 지금 열린 고르기 창을 닫는 함수

function liveAliases() {
  return Object.entries(draft.aliases).filter(([, a]) => !a.removed).map(([name, a]) => ({ name, ...a }));
}

function loadCatalog(refresh) {
  if (catalogLoading) return catalogLoading;
  catalogLoading = api("/api/models" + (refresh ? "?refresh=1" : ""))
    .then((r) => { C = r; })
    .catch((e) => { C = { models: [], providers: {}, errors: [e.error || "모델 목록을 읽지 못했어요."], fetchedAt: null }; })
    .finally(() => { catalogLoading = null; });
  return catalogLoading;
}

function slugFor(id) {
  const taken = new Set(Object.keys(draft.aliases));
  let base = (id.split("/").pop() || id).toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "model";
  if (!/^[a-z0-9]/.test(base)) base = ("m-" + base).slice(0, 40);
  let name = base;
  for (let i = 2; taken.has(name); i++) name = base.slice(0, 36) + "-" + i;
  return name;
}

// 목록에서 고른 모델을 내 모델(별칭)로 만든다. 이미 있으면 그걸 쓴다.
function ensureAlias(m) {
  const found = liveAliases().find((a) => a.engine === m.engine && a.model === m.id);
  if (found) return found.name;
  const removedSame = Object.entries(draft.aliases).find(([, a]) => a.removed && a.engine === m.engine && a.model === m.id);
  if (removedSame) { removedSame[1].removed = false; return removedSame[0]; }
  const name = slugFor(m.id);
  draft.aliases[name] = { label: m.name, model: m.id, accounts: (m.accounts || []).slice(0, 1), engine: m.engine, isNew: true };
  return name;
}

const providerOf = (a) => (a.engine === "claude-code" ? "anthropic" : String(a.model).split("/")[0]);
const providerName = (p) => (C && C.providers && C.providers[p]) || PROVIDER_NAMES[p] || p;

function modelSub(a) {
  return providerName(providerOf(a)) + " · " + a.model;
}

function closePop() { if (openPop) { const f = openPop; openPop = null; f(); } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });
document.addEventListener("mousedown", (e) => { if (openPop && !e.target.closest(".picker")) closePop(); });

/**
 * 두 단계 고르기 창. 첫 단계는 연결해 둔 회사(Claude 구독, DeepSeek, Xiaomi MiMo...),
 * 회사에 마우스를 올리거나 누르면 옆에 그 회사의 모델이 뜬다. 휴대폰에서는 눌러서 들어간다.
 * opts: { value(별칭 이름), onPick(별칭 이름 또는 ""), allowNone, exclude, label, engine(이 종류만), onPickModel(m), button, current(모델 ID) }
 */
function modelPicker(opts) {
  const wrap = h("div", { class: "picker" });
  const cur = opts.value && draft.aliases[opts.value];
  const btn = opts.button || h("button", { type: "button", class: "picker-btn", "aria-haspopup": "dialog", "aria-label": opts.label },
    h("span", { class: "pk-text" },
      h("span", { class: "pk-main" }, cur ? draftLabel(opts.value) : (opts.allowNone ? "없음 (넘기지 않음)" : "골라 주세요")),
      cur ? h("span", { class: "pk-sub" }, modelSub(cur)) : null));
  btn.addEventListener("click", () => {
    if (openPop && wrap.querySelector(".popwrap")) { closePop(); return; }
    closePop();
    const box = h("div", { class: "popwrap", role: "dialog", "aria-label": opts.label || "모델 고르기" });
    const main = h("div", { class: "pop" });
    const side = h("div", { class: "pop sub", hidden: true });
    box.append(main, side);
    if (wrap.getBoundingClientRect().left > window.innerWidth / 2) box.classList.add("right");
    wrap.append(box);
    openPop = () => box.remove();
    const narrow = () => window.matchMedia("(max-width: 640px)").matches;
    const pickAlias = (name) => { closePop(); opts.onPick(name); };
    const pickModel = (m) => { closePop(); if (opts.onPickModel) opts.onPickModel(m); else opts.onPick(ensureAlias(m)); };
    // 지금 고른 모델(엔진 + ID)
    const curKey = cur ? cur.engine + " " + cur.model : opts.current || "";
    let openProvider = null;

    // 회사별로 묶는다. 연결 목록(C)에 없는 내 모델도 그 회사 밑에 넣는다.
    function groups() {
      const map = new Map();
      const add = (p, m) => { if (!map.has(p)) map.set(p, []); const list = map.get(p); if (!list.some((x) => x.engine === m.engine && x.id === m.id)) list.push(m); };
      for (const m of (C ? C.models : [])) if (!opts.engine || m.engine === opts.engine) add(m.provider, { ...m, connected: true });
      for (const a of liveAliases()) {
        if (opts.engine && a.engine !== opts.engine) continue;
        if (opts.exclude && opts.exclude.includes(a.name)) continue;
        add(providerOf(a), { engine: a.engine, id: a.model, name: draftLabel(a.name), provider: providerOf(a), connected: false, alias: a.name });
      }
      // Claude 구독을 맨 앞에, 나머지는 이름순
      return [...map.entries()].sort((x, y) => (x[0] === "anthropic" ? -1 : y[0] === "anthropic" ? 1 : providerName(x[0]).localeCompare(providerName(y[0]))));
    }

    function drawMain() {
      const search = h("input", { type: "text", placeholder: "모델 찾기 (예: deepseek, flash)", "aria-label": "모델 찾기", autocomplete: "off", spellcheck: "false" });
      const list = h("div", {});
      search.addEventListener("input", () => fill());
      main.replaceChildren(h("div", { class: "pop-head" }, opts.engine === "claude-code" ? "Claude 구독" : "연결한 AI"), search, list);
      if (!narrow()) setTimeout(() => search.focus(), 0);

      function fill() {
        const q = search.value.trim().toLowerCase();
        const rows = [];
        if (opts.allowNone && !q) rows.push(h("button", { type: "button", class: "pop-item", onclick: () => pickAlias("") },
          h("span", { class: "pi-check" }, !opts.value ? "✓" : ""), h("span", { class: "pi-text" }, "없음 (넘기지 않음)")));
        const all = groups();
        if (q) {
          // 찾을 때는 회사를 펼쳐 모델을 바로 보여 준다.
          let shown = 0;
          for (const [p, models] of all) {
            const hit = models.filter((m) => (m.id + " " + m.name + " " + providerName(p)).toLowerCase().includes(q));
            if (!hit.length) continue;
            rows.push(h("div", { class: "pop-head" }, providerName(p)));
            for (const m of hit.slice(0, 50)) { rows.push(modelRow(m)); shown++; }
          }
          if (!shown) rows.push(h("p", { class: "pop-note" }, "찾는 모델이 없어요."));
          side.hidden = true;
        } else {
          for (const [p, models] of all) {
            const selected = models.some((m) => m.engine + " " + m.id === curKey);
            const connected = models.some((m) => m.connected);
            const row = h("button", { type: "button", class: "pop-item prov" + (openProvider === p ? " open" : ""), "data-key": p, "aria-haspopup": "menu", "aria-expanded": String(openProvider === p),
              onclick: () => showProvider(p, true) },
              h("span", { class: "pi-check" }, selected ? "✓" : ""),
              h("span", { class: "pi-text" }, providerName(p), h("span", { class: "pi-sub" }, connected ? "모델 " + models.filter((m) => m.connected).length + "개" : "연결 안 됨 · 저장해 둔 모델만")),
              h("span", { class: "pi-right" }, "›"));
            row.addEventListener("mouseenter", () => { if (!narrow()) showProvider(p, false); });
            rows.push(row);
          }
          if (!C) rows.push(h("p", { class: "pop-note" }, "연결해 둔 모델을 찾는 중이에요. 처음에는 조금 걸려요..."));
          if (C && C.errors && C.errors.length) rows.push(h("div", { class: "notice bad", style: "margin:6px" }, C.errors.join(" ")));
          if (C && !all.length) rows.push(h("p", { class: "pop-note" }, "연결해 둔 모델이 없어요. 'opencode auth login'으로 API 키를 넣거나 계정 칸에서 로그인해 주세요."));
          const custom = h("button", { type: "button", class: "pop-item prov" + (openProvider === "__custom" ? " open" : ""), "data-key": "__custom", onclick: () => showCustom(true) },
            h("span", { class: "pi-check" }), h("span", { class: "pi-text" }, "목록에 없는 모델 직접 입력"), h("span", { class: "pi-right" }, "›"));
          custom.addEventListener("mouseenter", () => { if (!narrow()) showCustom(false); });
          rows.push(h("div", { class: "pop-sep" }), custom);
          const stamp = C && C.fetchedAt ? "목록: " + formatUntil(C.fetchedAt) + " 기준 · " : "";
          rows.push(h("div", { class: "pop-note" }, stamp,
            h("button", { type: "button", class: "small-btn", style: "min-height:34px", onclick: async () => { C = null; fill(); await loadCatalog(true); fill(); } }, "목록 새로 고침")));
        }
        list.replaceChildren(...rows);
      }
      fill();
      if (!C) loadCatalog(false).then(() => { if (box.isConnected) fill(); });
      drawMain.refill = fill;
    }

    function modelRow(m) {
      const free = m.cost && m.cost.input === 0 && m.cost.output === 0;
      const sub = [m.id, m.context ? Math.round(m.context / 1000) + "K 문맥" : "", m.cost && !free ? "$" + m.cost.input + " / $" + m.cost.output : ""].filter(Boolean).join(" · ");
      return h("button", { type: "button", class: "pop-item", onclick: () => (m.alias && !opts.onPickModel ? pickAlias(m.alias) : pickModel(m)) },
        h("span", { class: "pi-check" }, m.engine + " " + m.id === curKey ? "✓" : ""),
        h("span", { class: "pi-text" }, m.name, free ? h("span", { class: "tag-free" }, "무료") : null, h("span", { class: "pi-sub" }, sub)));
    }

    function openSide(key, focus, children) {
      openProvider = key;
      for (const r of main.querySelectorAll(".prov")) r.classList.toggle("open", r.dataset.key === key);
      side.replaceChildren(...(narrow() ? [h("button", { type: "button", class: "pop-item", onclick: () => { side.hidden = true; main.hidden = false; openProvider = null; } },
        h("span", { class: "pi-check" }, "‹"), h("span", { class: "pi-text" }, "뒤로"))] : []), ...children);
      side.hidden = false;
      if (narrow()) main.hidden = true;
      else {
        // 고른 회사 줄 높이에 맞춰 옆 창을 띄운다(화면 밖으로 나가지 않게).
        const row = [...main.querySelectorAll(".prov")].find((r) => r.dataset.key === key);
        side.style.marginTop = "0px";
        if (row) {
          const want = row.getBoundingClientRect().top - main.getBoundingClientRect().top - 6;
          const room = window.innerHeight - ($("bar") ? $("bar").offsetHeight : 0) - main.getBoundingClientRect().top - side.offsetHeight - 12;
          side.style.marginTop = Math.max(0, Math.min(want, room)) + "px";
        }
      }
      if (focus) { const first = side.querySelector("button, input"); if (first) first.focus(); }
    }

    function showProvider(p, focus) {
      const entry = groups().find(([k]) => k === p);
      if (!entry) return;
      const models = entry[1];
      // 연결된 모델 중 추천(featured)을 먼저, 그다음 이름순
      const sorted = [...models].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
      openSide(p, focus, [h("div", { class: "pop-head" }, providerName(p)), ...sorted.map(modelRow)]);
    }

    function showCustom(focus) {
      const custom = h("input", { type: "text", placeholder: opts.engine === "claude-code" ? "예: claude-opus-5-5" : "예: deepseek/deepseek-chat", "aria-label": "모델 ID 직접 입력", autocomplete: "off", spellcheck: "false" });
      const use = () => {
        const id = custom.value.trim();
        if (!id) return;
        const engine = id.includes("/") ? "opencode" : "claude-code";
        if (opts.engine && engine !== opts.engine) { toast(opts.engine === "claude-code" ? "Claude 구독 모델은 '/' 없이 적어요." : "OpenCode 모델은 회사/모델 형식으로 적어요.", "bad"); return; }
        pickModel({ engine, id, name: id, provider: engine === "claude-code" ? "anthropic" : id.split("/")[0] });
      };
      custom.addEventListener("keydown", (e) => { if (e.key === "Enter") use(); });
      openSide("__custom", focus, [h("div", { class: "pop-head" }, "모델 ID 직접 입력"),
        h("div", { class: "inline-form", style: "padding:0 6px" }, custom, h("button", { type: "button", class: "small-btn", onclick: use }, "쓰기")),
        h("p", { class: "pop-note" }, "OpenCode 모델은 회사/모델(예: xiaomi/mimo-v2), Claude 구독 모델은 이름만 적어요.")]);
    }

    drawMain();
    // 지금 고른 모델의 회사를 처음부터 펼쳐 둔다.
    if (cur && !narrow()) showProvider(providerOf(cur), false);
  });
  wrap.append(btn);
  return wrap;
}

function accountStatus(a) {
  const u = U && U.accounts.find((x) => x.id === a.id);
  if (u && u.budget && u.budget.exceeded) return ["bad", "이번 달 예산 다 씀"];
  if (a.cooldown && a.cooldown.reason === "provider_auth") return ["bad", "로그인 필요"];
  if (a.cooldown) return ["warn", "한도로 쉬는 중 (~" + formatUntil(a.cooldown.until) + "까지)"];
  if (!a.loggedIn) return ["bad", "로그인 필요"];
  return ["ok", "사용 가능"];
}

function budgetText(b) {
  const parts = [];
  if (b.usd) parts.push("$" + b.usd);
  if (b.tokens) parts.push(fmtTokens(Number(String(b.tokens).replace(/[,\s]/g, ""))) + " 토큰");
  return parts.join(", ");
}

function budgetMeters(b) {
  const rows = [];
  if (b.monthlyBudgetUsd) rows.push(meterLine("이번 달 비용", "$" + b.usedUsd.toFixed(2) + " / $" + b.monthlyBudgetUsd, b.usedUsd / b.monthlyBudgetUsd));
  if (b.monthlyTokenLimit) rows.push(meterLine("이번 달 토큰", fmtTokens(b.usedTokens) + " / " + fmtTokens(b.monthlyTokenLimit), b.usedTokens / b.monthlyTokenLimit));
  return h("div", {}, rows);
}

function meterLine(title, text, ratio) {
  const r = Math.max(0, Math.min(1, ratio || 0));
  return h("div", { class: "budget-line" }, h("span", {}, title + ": " + text + " (" + Math.round((ratio || 0) * 100) + "%)"),
    h("div", { class: "meter" + (ratio >= 1 ? " full" : ""), role: "img", "aria-label": title + " " + Math.round((ratio || 0) * 100) + "%" }, h("i", { style: "width:" + (r * 100).toFixed(1) + "%" })));
}

function fmtTokens(n) {
  if (!n) return "0";
  if (n >= 100000000) return (n / 100000000).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, "") + "억";
  if (n >= 10000) return (n / 10000).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만";
  return n.toLocaleString("ko-KR");
}

function fmtUsd(n) {
  return n ? "$" + (n < 1 ? n.toFixed(3) : n.toFixed(2)) : "$0";
}

function rate(t) {
  return t.runs ? Math.round((t.ok / t.runs) * 100) + "%" : "-";
}

function aliasUsage(name) {
  const used = [];
  for (const t of S.taskTypes) {
    const d = draft.tasks[t.id];
    if (d.first === name) used.push(t.name + " 1순위");
    else if (d.second === name) used.push(t.name + " 2순위");
  }
  if (draft.highRiskAlias === name) used.push("위험한 작업에 먼저 쓸 AI");
  if (draft.planning.planner === name) used.push("작업을 나눌 AI");
  return used;
}

function removeModel(name) {
  const used = aliasUsage(name);
  if (used.length) {
    dialog("지금 쓰는 모델이에요", h("div", {}, h("p", {}, draftLabel(name) + "은(는) 이렇게 쓰고 있어요. 다른 모델로 바꾼 뒤 지워 주세요."), h("ul", {}, used.map((u) => h("li", {}, u)))),
      [{ text: "확인", value: null, kind: "primary" }]);
    return;

  const a = draft.aliases[name];
  if (a.isNew) delete draft.aliases[name]; else a.removed = true;
  rerender();
}

            idx >= 0 && d.accounts.length > 1 ? h("span", { class: "order" }, (idx + 1) + "번째") : null);
        }))
      : h("p", { class: "small" }, d.engine === "claude-code" ? "Claude 구독 계정을 따로 추가하지 않았어요. 평소 로그인한 계정을 써요." : "OpenCode 계정을 따로 추가하지 않았어요. 'opencode auth login'으로 넣은 API 키를 그대로 써요.");
    const changeBtn = h("button", { type: "button", class: "small-btn" }, "모델 바꾸기");
    return [prov, h("div", { class: "model" },
      h("div", { class: "model-head" }, h("strong", {}, d.label || a.name), h("span", { class: "tag" }, d.isNew ? "새로 추가" : providerName(providerOf(d)))),
      h("div", { class: "small", style: "margin:-4px 0 8px" }, "모델: " + d.model),
      h("label", { class: "field" }, h("span", {}, "보여 줄 이름"),
        h("input", { type: "text", maxlength: "80", value: d.label, oninput: (e) => { d.label = e.target.value; refreshBar(); }, onchange: () => rerender() })),
      h("div", { class: "field", style: "margin-top:10px" }, h("span", {}, "쓸 계정"), checks,
        same.length ? h("span", { class: "small" }, "아무것도 고르지 않으면 평소 로그인한 계정을 써요. 여러 개 고르면 고른 순서대로 쓰고, 한도에 걸리면 다음 계정으로 넘어가요.") : null),
      h("div", { class: "model-actions" },
        modelPicker({ button: changeBtn, current: d.engine + " " + d.model, engine: d.engine, label: "모델 바꾸기", onPickModel: (m) => {
          const auto = !d.label.trim() || d.label === d.model || (C && C.models.some((x) => x.name === d.label));
          d.model = m.id;
          if (auto || d.isNew) d.label = m.name;
          rerender();
        } }),
        h("button", { type: "button", class: "small-btn danger", onclick: () => removeModel(a.name) }, "삭제")))];
  });
  // 회사별로 묶는다(Claude 구독을 맨 앞에).
  const byProv = new Map();
  for (const [prov, card] of cards) { if (!byProv.has(prov)) byProv.set(prov, []); byProv.get(prov).push(card); }
  const provs = [...byProv.keys()].sort((x, y) => (x === "anthropic" ? -1 : y === "anthropic" ? 1 : providerName(x).localeCompare(providerName(y))));
  const addBtn = h("button", { type: "button", class: "primary" }, "+ 모델 추가");
  return h("section", { class: "card", id: "sec-models" },
    sectionTitle(5, "AI 모델"),
    h("p", { class: "help" }, "작업 표에서 고르는 내 모델이에요. 연결해 둔 모델 중에서 추가하고, 필요 없는 모델은 지워요. 작업 표에서 새 모델을 고르면 여기에 저절로 추가돼요. 회사별로 묶어 보여 줘요."),
    h("div", { class: "models-top" }, modelPicker({ button: addBtn, label: "모델 추가", onPickModel: (m) => { ensureAlias(m); rerender(); } })),
    provs.map((prov) => h("div", { class: "prov-group" },
      h("h3", { class: "prov-head" }, providerName(prov), h("span", { class: "small" }, " · 모델 " + byProv.get(prov).length + "개")),
      h("div", { class: "models" }, byProv.get(prov)))));
}

function renderMisc() {
  const times = [];
  for (let i = S.limits.maxFallbacks[0]; i <= S.limits.maxFallbacks[1]; i++) times.push(i);
  if (!times.includes(draft.maxFallbacks)) times.push(draft.maxFallbacks);
  const localId = "preferLocal";
  return h("section", { class: "card", id: "sec-misc" },
    sectionTitle(6, "기타"),
    h("div", { class: "toggle-row" },
      h("label", { for: localId }, h("strong", {}, "내 컴퓨터 모델 먼저 쓰기"),
        h("span", { class: "small" }, "테스트 작성, 문서 같은 가벼운 작업을 내 컴퓨터 모델(Ollama)에 먼저 맡겨요. 무료지만 느리거나 덜 정확할 수 있어요.")),
      h("span", { class: "switch" },
        h("input", { type: "checkbox", id: localId, role: "switch", checked: draft.preferLocal, onchange: (e) => { draft.preferLocal = e.target.checked; refreshBar(); } }),
        h("span", { class: "track", "aria-hidden": "true" }))),
    h("div", { class: "row2" },
      h("label", { class: "field" }, h("span", {}, "실패하면 다른 AI로 넘어가는 횟수"),
        h("select", { onchange: (e) => { draft.maxFallbacks = Number(e.target.value); refreshBar(); } },
          times.sort((a, b) => a - b).map((n) => h("option", { value: String(n), selected: n === draft.maxFallbacks }, n === 0 ? "넘어가지 않음" : n + "번까지"))),
        h("span", { class: "small" }, "한도 초과나 로그인 문제로 실패했을 때 2순위, 3순위 AI로 몇 번까지 넘어갈지 정해요.")),
      h("div", { class: "field" }, h("span", {}, "위험한 작업에 먼저 쓸 AI"),
        modelPicker({ value: draft.highRiskAlias, label: "위험한 작업에 먼저 쓸 AI", onPick: (v) => { if (!v) return; draft.highRiskAlias = v; rerender(); } }),
        h("span", { class: "small" }, "로그인, 결제, 삭제처럼 조심해야 하는 작업이에요."))));
}

// ---------- 왼쪽 메뉴: 누르면 오른쪽에 그 칸만 보여 준다 ----------
const SECTIONS = [
  ["sec-tasks", "작업별 담당 AI", "어떤 일을 어떤 AI에게"],
  ["sec-models", "AI 모델", "연결한 모델 추가·정리"],
  ["sec-accounts", "계정", "구독·API 계정과 예산"],
  ["sec-planning", "작업 나누기", "큰 작업을 나눠 맡기기"],
  ["sec-results", "작업이 끝나면", "합치기, 테스트, GitHub"],
  ["sec-usage", "사용량", "이번 달에 쓴 양"],
  ["sec-telegram", "텔레그램", "휴대폰으로 맡기기"],
  ["sec-misc", "기타", "넘어가는 횟수, 위험한 작업"],
];
let activeSection = SECTIONS.some(([id]) => "#" + id.slice(4) === location.hash) ? "sec-" + location.hash.slice(1) : "sec-tasks";
// 칸을 다시 그려도(replaceWith) 보이는 칸이 바뀌지 않게 스타일 한 줄로 고른다.
const activeStyle = document.head.appendChild(document.createElement("style"));

function renderSideNav() {
  return h("nav", { class: "side", "aria-label": "설정 메뉴" }, SECTIONS.map(([id, title, sub]) =>
    h("a", { href: "#" + id.slice(4), "data-sec": id, "aria-current": id === activeSection ? "page" : false, onclick: (e) => { e.preventDefault(); showSection(id, true); } },
      h("span", { class: "side-title" }, title), h("span", { class: "side-sub" }, sub))));
}

function showSection(id, fromClick) {
  activeSection = id;
  activeStyle.textContent = ".pane > section:not(#" + id + ") { display: none; }";
  for (const a of document.querySelectorAll("nav.side a")) a.setAttribute("aria-current", a.dataset.sec === id ? "page" : "false");
  if (fromClick) {
    history.replaceState(null, "", "#" + id.slice(4));
    closePop();
    if (window.matchMedia("(max-width: 900px)").matches) document.querySelector(".pane").scrollIntoView({ block: "start" });
    else window.scrollTo(0, 0);
  }
}

function rerender() {
  const y = window.scrollY;
  const open = [...document.querySelectorAll("details[open]")].map((d) => d.closest("section").id + ":" + [...d.closest("section").querySelectorAll("details")].indexOf(d));
  $("app").replaceChildren(h("div", { class: "settings" }, renderSideNav(),
    h("div", { class: "pane" }, renderTasks(), renderPlanning(), renderResults(), renderAccounts(), renderModels(), renderMisc(), renderUsage(), renderTelegram())));
  showSection(activeSection);
  for (const key of open) {
    const [sec, i] = key.split(":");
    const d = document.querySelectorAll("#" + sec + " details")[Number(i)];
    if (d) d.open = true;
  }
  $("footer").textContent = "설정 파일 위치: " + S.configDir;
  window.scrollTo(0, y);
  refreshBar();
}
function renderTasksOnly() { $("sec-tasks").replaceWith(renderTasks()); refreshBar(); }
function rerenderModels() {
  const sec = $("sec-models");
  const open = [...sec.querySelectorAll("details")].map((d) => d.open);
  const next = renderModels();
  next.querySelectorAll("details").forEach((d, i) => { d.open = !!open[i]; });
  sec.replaceWith(next);
  refreshBar();
}

// ---------- 불러오기와 동작 ----------
async function load(keepDraft) {
  const [s] = await Promise.all([api("/api/state"), loadUsage(), loadTelegram()]);
  S = s;
  const fresh = toDraft(s);
  if (keepDraft && draft) {
    // 계정만 새로 고치고, 저장하지 않은 편집 내용은 그대로 둔다.
    orig.aliases = fresh.aliases;
    orig.budgets = fresh.budgets;
    for (const id of Object.keys(draft.budgets)) if (!fresh.budgets[id]) delete draft.budgets[id];
    for (const id of Object.keys(fresh.budgets)) if (!draft.budgets[id]) draft.budgets[id] = clone(fresh.budgets[id]);
    for (const [name, a] of Object.entries(draft.aliases)) {
      if (!fresh.aliases[name] && !a.isNew) delete draft.aliases[name];
    }
    for (const name of Object.keys(fresh.aliases)) {
      if (!draft.aliases[name]) draft.aliases[name] = clone(fresh.aliases[name]);
    }
  } else {
    orig = fresh;
    draft = clone(fresh);
  }
  rerender();
}

async function withBusy(fn) {
  if (busy) return;
  busy = true;
  refreshBar();
  try { await fn(); } catch (e) { showError(e); } finally { busy = false; refreshBar(); }
}

function previewList(sentences) {
  return sentences.length ? h("ul", {}, sentences.map((s) => h("li", {}, s))) : h("p", {}, "바뀐 내용이 없어요.");
}

$("btnPreview").onclick = () => withBusy(async () => {
  const res = await api("/api/preview", buildChanges());
  const body = h("div", {}, previewList(res.sentences));
  if (res.problems.length) body.append(h("div", { class: "notice bad" }, h("strong", {}, "이대로는 저장할 수 없어요."), h("ul", {}, res.problems.map((p) => h("li", {}, p)))));
  else body.append(h("p", { class: "small" }, "저장하면 다음 작업부터 적용돼요."));
  const go = await dialog("이렇게 바뀌어요", body, res.problems.length
    ? [{ text: "닫기", value: null, kind: "primary" }]
    : [{ text: "닫기", value: null }, { text: "저장", value: "save", kind: "primary" }]);
  if (go === "save") await doSave();
});

async function doSave() {
  const res = await api("/api/save", buildChanges());
  await load(false);
  notice("ok", res.message, res.sentences);
  toast(res.message, "ok");
}
$("btnSave").onclick = () => withBusy(doSave);

$("btnRollback").onclick = () => withBusy(async () => {
  const dirty = countChanges(buildChanges()) > 0;
  const body = h("div", {},
    h("p", {}, "마지막으로 저장하기 전의 설정으로 돌아가요. 여러 번 누르면 더 이전으로 돌아가요."),
    dirty ? h("p", { class: "small" }, "지금 화면에서 바꾸고 저장하지 않은 내용은 사라져요.") : null);
  const ok = await dialog("이전 설정으로 되돌릴까요?", body, [{ text: "취소", value: false }, { text: "되돌리기", value: true, kind: "primary" }]);
  if (!ok) return;
  const res = await api("/api/rollback", {});
  await load(false);
  notice("ok", res.message);
  toast(res.message, "ok");
});

function addAccount(form) {
  withBusy(async () => {
    const id = (form.id || "").trim();
    if (!/^[a-z0-9][a-z0-9_-]{0,39}$/i.test(id)) throw { error: "영문 이름은 영문, 숫자, -, _ 로 40자 안에서 지어 주세요. (예: claude-main)", problems: [] };
    const provider = form.engine === "claude-code" ? "anthropic" : form.provider;
    const label = form.label.trim() || (form.engine === "claude-code" ? "Claude 구독" : PROVIDER_NAMES[provider] || provider);
    const res = await api("/api/accounts", { id, engine: form.engine, provider, label });
    await load(true);
    notice("ok", res.message);
    toast(res.message, "ok");
  });
}

function removeAccount(a) {
  withBusy(async () => {
    const ok = await dialog("'" + a.label + "' 계정을 지울까요?", h("p", {}, "목록에서만 지우고, 로그인 정보 폴더는 남겨 둬요."),
      [{ text: "취소", value: false }, { text: "삭제", value: true, kind: "primary danger" }]);
    if (!ok) return;
    const res = await api("/api/accounts/remove", { id: a.id });
    await load(true);
    notice("ok", res.message);
    toast(res.message, "ok");
  });
}

function resetAccount(a) {
  withBusy(async () => {
    const res = await api("/api/accounts/reset", { id: a.id });
    await load(true);
    toast(res.message, "ok");
  });
}

function loginAccount(a) {
  withBusy(async () => {
    const res = await api("/api/accounts/login", { id: a.id });
    const body = h("div", {}, h("p", {}, res.message));
    const buttons = [{ text: "확인", value: null, kind: "primary" }];
    if (!res.launched && res.commandText) {
      body.append(h("code", { class: "cmd" }, res.commandText));
      buttons.unshift({ text: "명령 복사", value: "copy" });
    }
    body.append(h("p", { class: "small" }, "로그인을 마치고 이 화면으로 돌아오면 상태가 새로 고쳐져요."));
    const v = await dialog("로그인", body, buttons);
    if (v === "copy") {
      try { await navigator.clipboard.writeText(res.commandText); toast("명령을 복사했어요.", "ok"); }
      catch (e) { toast("복사하지 못했어요. 직접 골라서 복사해 주세요.", "bad"); }
    }
  });
}

// 로그인 창에서 돌아오면 계정 상태를 새로 읽는다.
window.addEventListener("focus", () => { if (S && !busy) load(true).catch(() => {}); });
window.addEventListener("beforeunload", (e) => {
  if (draft && countChanges(buildChanges()) > 0) { e.preventDefault(); e.returnValue = ""; }
});

window.addEventListener("hashchange", () => { const id = "sec-" + location.hash.slice(1); if (SECTIONS.some(([x]) => x === id)) showSection(id); });

load(false).then(() => {
  // 회사 이름(DeepSeek, Xiaomi MiMo...)을 보여 주려고 연결 목록을 미리 읽어 둔다.
  loadCatalog(false).then(() => {
    if (!openPop && !countChanges(buildChanges()) && (!document.activeElement || document.activeElement === document.body)) rerender();
  });
}, (e) => {
  $("app").replaceChildren();
  showError(e);
  // 설정이 깨졌을 때도 되돌리기는 누를 수 있게 한다.
  S = { canRollback: true };
  refreshBar();
});
</script>
</body>
